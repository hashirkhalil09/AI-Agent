databases:
  - name: ai-social-agent-db
    plan: free
    databaseName: ai_social_agent
    user: ai_social_agent

services:
  # Main API — dashboard requests, auth, content generation trigger
  - type: web
    name: ai-social-agent-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-social-agent-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Background worker — runs the scheduler 24/7, publishes posts on time
  - type: worker
    name: ai-social-agent-worker
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-social-agent-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
